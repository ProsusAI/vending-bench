name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Engine and MCP transport tests
        run: >-
          uv run --python ${{ matrix.python-version }}
          --with pytest --with fastmcp==2.11.3
          python -m pytest tests/ -q

      - name: Generated files are in sync with config.toml
        run: uv run --python ${{ matrix.python-version }} python scripts/sync_config.py --check

      - name: Scripted reference still completes both horizons
        run: |
          uv run --python ${{ matrix.python-version }} python scripts/local_run.py --seed 1
          uv run --python ${{ matrix.python-version }} python scripts/local_run.py --seed 1 \
            --config tasks/vending-bench/environment/sim-server/variants/full-year.toml
