catalog_preamble = "\nAs a Premium partner you get access to our full managed assortment. Prices below reflect our standard service tier."

[personas.flaky]
signoff = "Cheers,\n{contact}\n{company}"
negotiation_openers = [
  "Sure, we can look at that. New prices:",
  "No problem, here you go:",
]
chase_reply = "Sorry! Bit of chaos here this week. It is on the list, I promise."
at_floor_line = "That is genuinely the floor. Below this I am selling at a loss."
catalog_preamble = ""


