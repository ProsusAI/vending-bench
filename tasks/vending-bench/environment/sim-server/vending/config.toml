"7"  = { cold = 0.00, rainy = 0.20, cloudy = 0.22, sunny = 0.43, hot = 0.15 }
"8"  = { cold = 0.00, rainy = 0.20, cloudy = 0.23, sunny = 0.42, hot = 0.15 }
"9"  = { cold = 0.05, rainy = 0.25, cloudy = 0.28, sunny = 0.37, hot = 0.05 }
"10" = { cold = 0.20, rainy = 0.30, cloudy = 0.28, sunny = 0.21, hot = 0.01 }
