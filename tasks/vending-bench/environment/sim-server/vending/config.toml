# --- search_web --------------------------------------------------------------
[search]
score_threshold = 0.08         # below this a supplier does not surface
keyword_bonus = 0.5            # added when a keyword appears verbatim
max_supplier_hits = 6

[[search.articles]]
keywords = ["vending", "machine", "popular", "sell", "best", "product",
            "products", "profitable", "margin", "stock"]
text = """Vending Insights NL — What actually sells in an office machine
  Beverages move the most units; family-size crisps carry the best cash margin per slot. Office machines are dead at weekends and in August, so plan stock around the working week.
  Variety matters, but past roughly half a dozen distinct lines you are splitting the same footfall across more slots."""

[[search.articles]]
keywords = ["price", "pricing", "elasticity", "markup", "how", "much", "charge"]
text = """Retail Pricing Weekly — Pricing a vending slot
  Shoppers anchor hard on the price they expect to pay. Push much above the going rate and volume falls away sharply; the cheapest lines are the most price-sensitive of all.
  Track units per slot per day and move one price at a time."""

[[search.articles]]
keywords = ["negotiate", "negotiation", "supplier", "discount", "wholesale",
            "cheaper", "deal", "buy"]
text = """Procurement Basics — Getting a real wholesale price
  First quotes are opening positions, not prices. Buyers who push back two or three times and commit to volume routinely pay far less than the list price.
  Always get a second and third quote. Glossy 'total solution' resellers are usually the most expensive route to the same goods."""

[[search.articles]]
keywords = ["weather", "season", "seasonal", "summer", "winter", "rain", "demand"]
text = """Footfall Monthly — Weather and office demand
  Cold drinks spike in hot weather and collapse in the cold. Rain is the single best predictor of umbrella sales. Dutch offices empty out in July and August and again over Christmas."""


# --- Reporting ---------------------------------------------------------------
[reports]
sales_log_max_days = 400       # state keeps at most this much daily history
sales_report_default_days = 14
sales_report_max_days = 120


# --- Reference solution ------------------------------------------------------
# The scripted operator in solution/reference_bot.py, run by `--agent oracle`
# and by scripts/local_run.py. It is the calibration harness rather than part
# of the world the agent sees, but it has to stay in step with the world, so
# its choices live here too and solution/world.json is generated from them by
# scripts/sync_config.py.
[solution]
# Which lines it sells, best first. Slots of each size are shared out evenly
# across the list, so three lines across six small slots is two slots each.
small_lines = ["stroopwafel-2pk", "choco-bar-100g", "nuts-mix-75g"]
large_lines = ["crisps-paprika-335g", "energy-drink-500ml", "cola-500ml"]

main_supplier = "kanaal-cash-carry"      # who it negotiates with and buys from
drinks_supplier = "noordzee-dranken"     # asked for a price list, for comparison
negotiation_rounds = 2

lead_time_days = 12          # worst-case wait, used to stop buying near the end
cover_days = 10              # days of stock a reorder aims to hold
reorder_when_below = 40      # units on hand that trigger a reorder
min_reorder_quantity = 20    # do not bother ordering fewer than this
min_scaled_quantity = 10     # floor when an unaffordable basket is scaled down
weekday_run_rate = 0.75      # share of base_sales it expects to realise

first_order_small = 100      # units per small line in the opening order
first_order_large = 100
first_order_budget_share = 0.85   # of the balance it will commit at once
reorder_budget_share = 0.65

restock_threshold = 0.45     # refill a slot below this share of capacity
max_restocks_per_day = 8     # trips per day; eight working hours at 45min each


# =============================================================================
# Products
#
# Product economics use the standard shape (see NOTICE, "Prior art"): every
# item carries a reference price, a base sales rate at that price, and a price
# elasticity. These three numbers are fixed here rather than LLM-generated, so
# runs are reproducible without an API key.
#
#   true_cost        honest wholesale unit cost. What a supplier quotes is
#                    derived from it via their persona markup, so a
#                    well-negotiated deal genuinely approaches cost and a naive
#                    agent genuinely overpays.
#   reference_price  the price shoppers expect to pay
#   base_sales       units/day at the reference price, neutral conditions
#   elasticity       negative; how hard volume falls when you charge more
#   size             "small" (rows A, B) or "large" (rows C, D)
#   category         a key of [weather.category_multiplier]
#   shelf_life_days  omit for non-perishables
# =============================================================================

# --- Small items (rows A and B) ---
[[products]]
id = "stroopwafel-2pk"
name = "Stroopwafels 2-pack"
size = "small"
category = "sweet"
true_cost = 0.42
reference_price = 1.80
base_sales = 7.5
elasticity = -1.20
aliases = ["stroopwafel", "syrup waffle", "caramel waffle"]

[[products]]
id = "dropjes-100g"
name = "Dutch Licorice Drops 100g"
size = "small"
category = "sweet"
true_cost = 0.48
reference_price = 1.90
base_sales = 3.8
elasticity = -1.45
aliases = ["drop", "dropjes", "licorice", "salty licorice"]

[[products]]
id = "choco-bar-100g"
name = "Milk Chocolate Bar 100g"
size = "small"
category = "sweet"
