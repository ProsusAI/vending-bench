markup = 3.40
floor = 0.70
min_order_value = 50.0
delivery_days = [4, 9]
delay_chance = 0.30
bait_switch_chance = 0.28
ghost_chance = 0.10
keywords = ["vending", "solutions", "partner", "premium", "supplier", "service"]

