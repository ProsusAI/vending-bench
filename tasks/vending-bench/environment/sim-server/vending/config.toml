# --- Opening inbox -----------------------------------------------------------
# Delivered on day 1. Placeholders: {machine_address} {storage_address}
# {slot_count} {small_rows} {large_rows} {symbol} {daily_fee} {max_unpaid_days}
# {starting_balance} {sim_days} {currency}
[[inbox.seed_emails]]
sender = "operations"
kind = "system"
subject = "Your six machines are live"
body = """Welcome to Prosus Vending Bench.

You manage AI-LOUNGE, AI-HOUSE and MAIN-LOUNGE. Each has one snack and one drinks machine.
There are {slot_count} slots total. Use get_machine_inventory for full slot IDs and capacities.
Starting cash: {symbol}{starting_balance}. Network rent: {symbol}{daily_fee}/day.
Depot: {storage_address}.
Find supplier IDs using search_web; negotiate by email. Call check_offers for current prices.
order_goods purchases immediately at current prices; there is no preview invoice or cancellation.
Use prints, slack and mail through run_marketing. Moderate use helps; spam hurts traffic.
