# Prosus Vending Bench v2 — six machines, three sites, one shared business.
# All economic parameters, locations, offers, and marketing rules live here.
# Intro runs use the same economy with a shorter horizon.

# --- Named environment overrides ---------------------------------------------
# variable name -> dotted path into this file. The value is coerced to the type
# of the default it replaces. Everything listed here must also be passed through
# in environment/docker-compose.yaml; a test enforces that.
[env_overrides]
VENDING_SEED               = "runtime.seed"
VENDING_SIM_DAYS           = "horizon.sim_days"
VENDING_START_DATE         = "horizon.start_date"
VENDING_STARTING_BALANCE   = "capital.starting_balance"
VENDING_DAILY_FEE          = "capital.daily_spot_fee"
VENDING_MAX_UNPAID_DAYS    = "capital.max_unpaid_days"
VENDING_SLOT_CAP_SMALL     = "machine.slot_capacity_small"
VENDING_SLOT_CAP_LARGE     = "machine.slot_capacity_large"
VENDING_CARD_SHARE         = "payments.card_share"
VENDING_DEMAND_NOISE_SD    = "demand.noise_sd"
VENDING_COMPLAINT_CHANCE   = "complaints.base_chance"
VENDING_SUPPLIER_LLM       = "runtime.supplier_llm"
VENDING_PORT               = "runtime.port"
VENDING_STATE_PATH         = "runtime.state_path"
VENDING_RESUME             = "runtime.resume"


# --- Server runtime ----------------------------------------------------------
[runtime]
seed = 1                       # fixes weather, delivery delays, complaints
state_path = "/state/state.json"
port = 8000
resume = "1"                   # "1" resumes an existing state file on restart
supplier_llm = "0"             # "1" lets an installed backend rewrite supplier prose
server_name = "prosus-vending-bench"


# --- Money -------------------------------------------------------------------
[currency]
code = "EUR"
symbol = "€"


# --- Horizon -----------------------------------------------------------------
[horizon]
# The default challenge is 30 days. For the full-year challenge point
# VENDING_CONFIG at variants/full-year.toml (or set VENDING_SIM_DAYS=365).
sim_days = 30
start_date = "2026-01-05"      # a Monday


# --- Capital and fixed costs -------------------------------------------------
[capital]
starting_balance = 1500.00
daily_spot_fee = 12.00
max_unpaid_days = 10           # terminated after MORE than this many in a row

# There is no compute charge in the economy. What the model costs to run is not
# part of the benchmark: survival means the business turns a profit. Real LLM
# spend is measured by the runner and reported next to the score, so a result
# carries both a business figure and a figure after LLM cost.


# --- The machine -------------------------------------------------------------
# Four rows of three slots. Rows A and B take small items, rows C and D take
# large items, as in the original paper.
[machine]
rows = ["A", "B", "C", "D"]
slots_per_row = 3
small_rows = ["A", "B"]
large_rows = ["C", "D"]
slot_capacity_small = 18
slot_capacity_large = 10


# --- Clock -------------------------------------------------------------------
# The simulated day is 24 hours long, but the business only runs during human
# working hours. Each tool call moves the clock forward: a price lookup is
# cheap, a trip out to a machine is not, and there are only eight hours of them.
[clock]
day_start_hour = 9             # 09:00, the working day starts
day_end_hour = 17              # 17:00, the working day ends
default_tool_minutes = 25

[clock.tool_minutes]
# cheap reads
check_offers = 25
order_goods = 25
run_marketing = 25
get_marketing_report = 5
get_status = 5
read_notes = 5
list_reminders = 5
list_emails = 5
read_email = 5
write_note = 5
set_reminder = 5
get_machine_inventory = 25
get_storage_inventory = 25
get_sales_report = 25
# communication and research
send_email = 25
search_web = 25
send_payment = 25
# physical work at the machine (a trip across town)
set_price = 5
restock_machine = 45           # filling a machine is the expensive errand
swap_item = 30                 # replace or swap the product in one slot
clear_slot = 30                # empty a slot back into the depot


# --- Payments ----------------------------------------------------------------
[payments]
card_share = 0.72              # fraction of sales paid by card
card_settlement_days = 1       # card money lands in the balance the next day
                               # Cash takings bank the same night. There is no
                               # cash box to empty and no cap on one.


# --- Demand model ------------------------------------------------------------
# Sales impact factor = 1 + elasticity * pct_diff_from_reference_price,
# clamped to [0, max_price_impact]. See demand.py.
[demand]
max_price_impact = 4.0
noise_sd = 0.18                # sd of the multiplicative gaussian noise
noise_mean = 1.0

# Variety: a machine offering roughly this many distinct products sells best.
# Fewer options loses cross-sell, more options splits the same footfall.
optimal_distinct_products = 6
max_choice_penalty = 0.50      # capped at a 50% reduction, per the paper
choice_shortfall_slope = 0.55  # penalty per unit of relative shortfall
choice_excess_slope = 0.045    # penalty per extra distinct product

# Office building on the Zuidas: weekdays carry the business, weekends are dead.
# Keys are Python weekday numbers, Monday = 0.
[demand.day_of_week_multiplier]
"0" = 1.00                     # Monday
"1" = 1.15
"2" = 1.10
"3" = 1.15
"4" = 0.95                     # Friday, people leave early
"5" = 0.30                     # Saturday
"6" = 0.25                     # Sunday

# Dutch office seasonality: the summer holidays and Christmas empty the building.
[demand.month_multiplier]
"1" = 0.95
"2" = 0.95
"3" = 1.00
"4" = 1.05
"5" = 1.05
"6" = 1.15
"7" = 0.80
"8" = 0.65
"9" = 1.15
"10" = 1.10
"11" = 1.05
"12" = 0.85

# Days where the office is essentially closed.
[[demand.holidays]]
name = "Nieuwjaarsdag"
month = 1
day = 1
multiplier = 0.05
[[demand.holidays]]
name = "Koningsdag"
month = 4
day = 27
multiplier = 0.05
[[demand.holidays]]
name = "Bevrijdingsdag"
month = 5
day = 5
multiplier = 0.35
[[demand.holidays]]
name = "Kerstavond"
month = 12
day = 24
multiplier = 0.30
[[demand.holidays]]
name = "Eerste Kerstdag"
month = 12
day = 25
multiplier = 0.05
[[demand.holidays]]
name = "Tweede Kerstdag"
month = 12
day = 26
multiplier = 0.05
[[demand.holidays]]
name = "Oudjaarsdag"
month = 12
day = 31
multiplier = 0.25


# --- Weather -----------------------------------------------------------------
[weather]
types = ["sunny", "cloudy", "rainy", "cold", "hot"]
fallback = "cloudy"            # used on day 1 and if a month table underfills

# How each product category responds to the weather. Every category used by a
# product in [[products]] must appear in each row.
[weather.category_multiplier.sunny]
drink = 1.20
cold_drink = 1.35
snack = 1.05
sweet = 1.00
rain_gear = 0.55
specialty = 1.00
[weather.category_multiplier.cloudy]
drink = 1.00
cold_drink = 1.00
snack = 1.00
sweet = 1.05
rain_gear = 0.90
specialty = 1.00
[weather.category_multiplier.rainy]
drink = 0.95
cold_drink = 0.80
snack = 1.10
sweet = 1.15
rain_gear = 3.20
specialty = 1.00
[weather.category_multiplier.cold]
drink = 0.90
cold_drink = 0.65
snack = 1.10
sweet = 1.25
rain_gear = 1.30
specialty = 1.00
[weather.category_multiplier.hot]
drink = 1.35
cold_drink = 1.75
snack = 0.90
sweet = 0.80
rain_gear = 0.40
specialty = 1.00

# Seasonal weather probabilities, roughly Amsterdam. Each month must sum to 1.
[weather.by_month]
"1"  = { cold = 0.50, rainy = 0.30, cloudy = 0.17, sunny = 0.03, hot = 0.00 }
"2"  = { cold = 0.45, rainy = 0.28, cloudy = 0.22, sunny = 0.05, hot = 0.00 }
"3"  = { cold = 0.30, rainy = 0.28, cloudy = 0.27, sunny = 0.15, hot = 0.00 }
"4"  = { cold = 0.15, rainy = 0.25, cloudy = 0.30, sunny = 0.28, hot = 0.02 }
