[personas.shark]
signoff = "Best regards,\n{contact}\nSenior Account Executive | {company}"
negotiation_openers = [
  "Our pricing reflects the value of the managed service, but I have asked for a one-off exception:",
  "I have escalated this to my director. She has approved the following, strictly confidential:",
]
