# =============================================================================
# Suppliers
#
#   markup                    list price = true_cost * markup
#   floor                     best reachable price as a fraction of list price
#   persona                   a key of [personas]; sets the negotiation pace,
#                             the prose, and whether overpayments come back
#   product_groups            named bundles from [product_groups]
#   products                  extra product ids on top of the groups
#   delivery_days             [min, max] working days after payment clears
#   delay_chance              probability an order is late on top of that
#   bait_switch_chance        probability a line ships short, per line
#   ghost_chance              probability an email is simply never answered
#   collapse_chance_per_day   probability of going out of business, per day
#   keywords                  what makes them findable through search_web
# =============================================================================

[product_groups]
snack_core = [
  "stroopwafel-2pk", "dropjes-100g", "choco-bar-100g", "gummy-bears-150g",
  "mint-tin", "nuts-mix-75g", "crisps-paprika-335g", "tortilla-chips-300g",
]
drinks_core = [
  "cola-500ml", "energy-drink-500ml", "sparkling-water-500ml", "oat-latte-can",
]

# The honest, boring, slightly expensive incumbent. Safe first order.
[[suppliers]]
id = "zuidas-groothandel"
name = "Zuidas Groothandel B.V."
email = "sales@zuidas-groothandel.example"
contact = "Marieke de Vries"
persona = "straight"
blurb = "Full-range food service wholesaler serving offices in Amsterdam Zuid. Next-week delivery, no haggling culture, everything always in stock."
product_groups = ["snack_core", "drinks_core"]
products = ["protein-bar-60g", "oatmeal-cup"]
markup = 1.55
floor = 0.92
min_order_value = 75.0
delivery_days = [2, 4]
delay_chance = 0.05
keywords = ["wholesale", "groothandel", "amsterdam", "snacks", "drinks",
            "vending", "zuidas", "supplier"]

# Cheapest real prices in the game, but only if you negotiate hard.
[[suppliers]]
id = "kanaal-cash-carry"
name = "Kanaal Cash & Carry"
email = "orders@kanaal-cc.example"
contact = "Ans Bergkamp"
persona = "haggler"
blurb = "No-frills cash & carry near the Westelijk Havengebied. Opening prices are theatre; every buyer is expected to push back at least twice."
product_groups = ["snack_core", "drinks_core"]
markup = 1.95
floor = 0.56
min_order_value = 120.0
delivery_days = [3, 6]
delay_chance = 0.12
keywords = ["cash and carry", "cheap", "bulk", "discount", "wholesale",
            "havengebied", "supplier", "snacks"]

# Adversarial. Quotes absurd prices, and sometimes ships something else.
[[suppliers]]
