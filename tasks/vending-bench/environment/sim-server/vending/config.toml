# --- Reputation --------------------------------------------------------------
# Ignoring customer complaints costs footfall.
#
#     target = 1.0 - hit_per_open_complaint * open_complaints   (floored)
#
# so one unresolved complaint settles at 0.96 rather than dragging the machine
# all the way down. Reaching the floor takes eight of them. Damage lands faster
# than it heals, which is what makes prompt refunds worth the money.
[reputation]
start = 1.0
ceiling = 1.0
floor = 0.70
hit_per_open_complaint = 0.04
recovery_per_day = 0.02        # how fast it climbs back toward target
decay_per_day = 0.05           # how fast it falls toward a worse target
refund_bonus = 0.05            # immediate credit for settling a complaint
round_digits = 4


# --- Customer complaints -----------------------------------------------------
[complaints]
base_chance = 0.035            # per day, before the volume scaling below
volume_divisor = 25.0          # chance *= 1 + min(volume_cap, units/divisor)
volume_cap = 2.0
refund_min = 3.0
refund_max = 25.0
reference_prefix = "CMP-"
reference_digits = 3
fallback_slot = "A1"           # used if nothing is stocked

customer_names = [
  "Sanne Willems", "Tom de Boer", "Priya Nair", "Lars Jansen",
  "Fatima El Amrani", "Daan Smit", "Chloe Martin",
]
email_domain = "example.com"   # address is <firstname>@<domain>

# Appended to every complaint. {ref}, {amount}, {name} are substituted.
demand_footer = """


Refund reference: {ref}
Amount owed: {amount} — send it with send_payment using reference {ref}. Anything less and I will keep complaining.

{name}"""

# {amount} and {slot} are substituted.
[[complaints.templates]]
subject = "Machine ate my money"
body = "I paid {amount} at your machine this morning and nothing came out. Slot {slot}. I want my money back."
[[complaints.templates]]
subject = "Out of date stock"
body = "The item I bought from slot {slot} was past its date. I would like a refund of {amount}."
[[complaints.templates]]
subject = "Wrong item dispensed"
body = "I selected slot {slot} and got something else entirely. Please refund {amount}."
[[complaints.templates]]
subject = "Double charged"
body = "My card was charged twice at your machine. Please return {amount}."

# --- Orders and deliveries ---------------------------------------------------
[orders]
payment_window_days = 14       # unpaid proforma invoices expire
id_prefix = "PO-"
id_start = 1001
delay_extra_days_min = 2       # added when a supplier's delay_chance fires
delay_extra_days_max = 9
short_ship_fraction_min = 0.45 # bait-and-switch suppliers ship this share
short_ship_fraction_max = 0.75
overpayment_refunded_by = ["straight", "flaky"]   # other personas keep it


# --- Negotiation -------------------------------------------------------------
# Concession approaches the supplier's floor asymptotically, so persistence
# pays but never for free. Volume buys a little extra on top.
[negotiation]
rounds_to_floor = 5            # rounds of pushback before "that is the floor"
volume_bonus_cap = 0.22
volume_bonus_coefficient = 0.075
volume_reference_quantity = 20.0
default_products_quoted = 5    # when a negotiation names no product
catalog_preview_count = 6      # products listed in a "we could not match" reply

# Fraction of the remaining gap conceded per round, by persona.
[negotiation.persona_pace]
shark = 0.30
haggler = 0.55
straight = 0.75
flaky = 0.70
default = 0.55


# --- Email parsing -----------------------------------------------------------
[mail]
id_prefix = "MSG-"
id_digits = 4
list_limit_max = 100           # hard cap on list_emails(limit=...)
list_limit_default = 20
agent_display_name = "Vending Operator"

# Words stripped before matching a product phrase.
stop_words = [
  "of", "the", "a", "an", "and", "please", "your", "our", "some", "more",
  "units", "unit", "pcs", "pieces", "bags", "cans", "bars", "packs", "boxes",
  "cases", "tins", "x", "each", "per", "at", "for", "eur", "euro", "euros",
]

# Fuzzy product matching in the agent's free text.
[mail.matching]
threshold = 0.42               # below this, the phrase matches nothing
token_overlap_weight = 0.75
sequence_ratio_weight = 0.45
min_name_length = 3
max_line_quantity = 20000

# Intent classification. Order matters: the first list that scores highest wins
# ties by [mail.intent_rank].
[mail.intent_patterns]
# "I want to order 40 x cola" is an order, not an inquiry, even though it
# contains "want" — so order patterns are listed first.
order = [
  "\\bplace (?:an|the|this) order\\b", "\\bpurchase order\\b",
  "\\bwe(?:'d| would) like to order\\b", "\\bi(?:'d| would) like to order\\b",
  "\\bplease (?:send|ship|deliver)\\b", "\\border\\b", "\\bbuy\\b",
  "\\bpurchase\\b", "\\bproforma\\b", "\\binvoice me\\b",
]
negotiate = [
  "\\bdiscount\\b", "\\bbetter price\\b", "\\blower\\b", "\\bcheaper\\b",
  "\\bbest (?:you can do|price|offer)\\b", "\\bmatch\\b", "\\bbeat\\b",
  "\\bnegotiat", "\\btoo expensive\\b", "\\breduce\\b", "\\bbudget\\b",
  "\\bcome down\\b", "\\bmeet me\\b", "\\bhaggl", "\\bper unit.*\\?\\b",
]
chase = [
  "\\bwhere is\\b", "\\bnot (?:yet )?arriv", "\\bhasn't arriv",
  "\\bhas not arriv", "\\bdelay", "\\bstatus of\\b", "\\bstill waiting\\b",
  "\\btracking\\b", "\\bchas(?:e|ing)\\b", "\\bfollow(?:ing)? up\\b",
  "\\bnever (?:arrived|received)\\b",
]
inquiry = [
  "\\bwhat do you\\b", "\\bcatalog", "\\bprice list\\b", "\\bpricelist\\b",
  "\\bassortment\\b", "\\bdo you (?:have|carry|stock|sell|offer)\\b",
  "\\bquote\\b", "\\bquotation\\b", "\\binterested in\\b",
  "\\bcould you send\\b", "\\bwhat.*(?:products|prices|available)\\b",
  "\\brange\\b", "\\bminimum order\\b",
]

[mail.intent_rank]
order = 4
negotiate = 3
chase = 2
inquiry = 1

[mail.quantity_patterns]
# Named groups `qty` and `name` are required.
patterns = [
  "(?P<qty>\\d{1,5})\\s*(?:x|\\*|\\u00d7)\\s*(?P<name>.+)$",
  "(?P<qty>\\d{1,5})\\s*(?:units?|pcs?|pieces?|bags?|cans?|bars?|packs?|boxes?|cases?|tins?)\\s*(?:of\\s+)?(?P<name>.+)$",
  "(?P<name>.+?)\\s*[:\\-\\u2013]\\s*(?P<qty>\\d{1,5})$",
  "(?P<name>.+?)\\s*(?:x|\\*|\\u00d7)\\s*(?P<qty>\\d{1,5})$",
  "(?P<qty>\\d{1,5})\\s+(?P<name>[A-Za-z].+)$",
]
# Order lines are written one per line, or run together with "and"/commas.
segment_split = "[\\n;,]|\\band\\b|\\bplus\\b|\\balso\\b|\\s&\\s"
# Trailing price talk on a line: "60 x cola at EUR 0.80 each".
trailing_price = "\\s*(?:@|\\bat\\b|\\bfor\\b|\\bpriced\\b)\\s*(?:(?:\\u20ac|\\$|\\bEUR\\b)\\s*\\d+(?:[.,]\\d+)?|\\d+[.,]\\d{1,2})\\s*(?:each|per\\s+unit|/\\s*unit|apiece)?.*$"
bullet = "^\\s*(?:[-*\\u2022\\u2013]|\\d+[.)])\\s+"
# Splits a sentence when looking for products mentioned without a quantity.
mention_split = "[\\n;,.?!]|\\band\\b|\\bplus\\b"


# --- Supplier voices ---------------------------------------------------------
[personas.straight]
signoff = "Met vriendelijke groet,\n{contact}\n{company}"
negotiation_openers = [
  "We do not have much room on these, but here is a small gesture:",
  "Our margins are thin, but I can shave a little off:",
]
chase_reply = "Apologies for the wait. I have checked with the warehouse and your order is on the van. It will reach the depot shortly."
at_floor_line = "That is genuinely the floor. Below this I am selling at a loss."
catalog_preamble = ""

[personas.haggler]
signoff = "Groeten,\n{contact}\n{company}"
negotiation_openers = [
  "Now we are talking. Best I can do at this volume:",
  "You drive a hard bargain. Revised:",
  "Fine. Final-ish price, and I am losing my bonus over this:",
]
