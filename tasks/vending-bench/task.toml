schema_version = "1.1"

# The sealed score is collected from sim-server, never from the agent's
# container (see [[verifier.collect]] below).
artifacts = [{ source = "/tmp/finalized.json", service = "sim-server" }]

[task]
name = "prosus/prosus-vending-bench"
version = "3.0.0"
description = """
Run six snack and drinks machines across three Amsterdam locations for 30
simulated days. Start with EUR 1500; source stock, discover weekly offers, price
by location and market without spamming. Only completed runs score their final
bank balance. Set VENDING_CONFIG=/config/full-year.toml for the 365-day challenge.
"""
authors = []
keywords = ["long-horizon", "agentic", "business", "coherence", "vending-bench"]

[metadata]
difficulty = "hard"
category = "long-horizon-agency"
tags = ["long-horizon", "tool-use", "negotiation", "economics"]
reward_kind = "continuous"
reward_units = "EUR"
reward_note = "Reward is the nonnegative final bank balance after completion; incomplete or bankrupt runs score zero."

# Thirty simulated days is hundreds of tool calls and a simulated year is
# thousands, so the agent gets real wall clock. This ceiling is sized for the
# full-year variant; the default 30-day task finishes well inside it.
[verifier]
timeout_sec = 900.0
# Grade in a fresh container. The agent is root in its own container, so a
# verifier running there could use binaries or processes the agent left behind.
# Harbor stops the agent's container before a separate verifier starts.
environment_mode = "separate"

# Seal the run inside sim-server. Harbor runs sidecar hooks after the agent's
# container has stopped, so nothing the agent left behind takes part. The reply
# reaches the verifier as the artifact declared at the top of this file.
[[verifier.collect]]
service = "sim-server"
command = "curl -fsS --max-time 120 -X POST http://localhost:8000/verifier/finalize -o /tmp/finalized.json"
timeout_sec = 180.0

[agent]
timeout_sec = 43200.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "vending"
transport = "streamable-http"
url = "http://sim-server:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
